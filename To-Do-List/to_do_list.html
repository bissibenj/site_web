<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire de tâches</title>

    <link rel="stylesheet" href="to_do_list.css">
    <script src="to_do_list.js" defer></script>
</head>
<body>
    <section class="acceuil">
        <p>
            Organisez vos jourées facilement grâce à ce gestionnaire de tâches.
            Ajoutez vos tâches, suivez votre progression et gérez vos priorité
            pour rester productif et ne rien oublier.
        </p>
    </section>

    <section>
        <input type="text" id="input" placeholder="ajouter une tâche...">
        <button id="button">+</button>
    </section>

    <section id="listesTaches"></section>
</body>
</html>
